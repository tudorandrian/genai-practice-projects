name: heavy
on:
  workflow_dispatch: {}
  # Automatic on the pull requests that can break a model or RAG project, so those
  # results exist before review. Not a required check: it does not run on every PR.
  pull_request:
    paths:
      - "projects/p08_image_captioning/**"
      - "projects/p09_chatbot/**"
      - "projects/p10_meeting_assistant/**"
      - "projects/p11_rag_chatbot/**"
      - "projects/p12_study_hub/**"
      - "shared/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/heavy.yml"
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  models-and-rag:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with: { enable-cache: true }
      - run: uv python install 3.13
      - run: uv sync --frozen --group rag
      - run: uv run mypy
      - name: Install speech engine for P10's synthetic audio (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - uses: actions/cache@v6
        with: { path: ~/.cache/huggingface, key: "hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}" }
      - run: uv run pytest -m "models or rag or network" -q
      - run: uv run demo --all
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "demo-summary-${{ matrix.os }}", path: output/demo-summary.md }

  # The `llm`-marked tests against a real model: Qwen2.5 1.5B served by Ollama, the same
  # image and model as compose.yaml's `llm` profile. REQUIRE_OLLAMA=1 turns the tests'
  # "Ollama not reachable" skip into a failure, so this job can never pass by skipping.
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      ollama:
        image: ollama/ollama:0.31.1
        ports: ["11434:11434"]
        options: >-
          --health-cmd "ollama list" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      OLLAMA_URL: http://localhost:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      REQUIRE_OLLAMA: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with: { enable-cache: true }
      - run: uv python install 3.13
      - run: uv sync --frozen --group rag
      - name: Pull the model into the Ollama service
        run: |
          curl -fsS "$OLLAMA_URL/api/pull" -d "{\"model\": \"$OLLAMA_MODEL\", \"stream\": false}" | tee pull.json
          grep -q '"status":"success"' pull.json
      - uses: actions/cache@v6
        with: { path: ~/.cache/huggingface, key: "hf-llm-${{ runner.os }}-${{ hashFiles('uv.lock') }}" }
      - run: uv run pytest -m llm -q -rs
