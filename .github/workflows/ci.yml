name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.1.0
        with: { enable-cache: true }
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: pre-commit hooks on every file (gitleaks has its own full-history job)
        if: runner.os == 'Linux'
        env: { SKIP: gitleaks }
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "core and not network" --cov=projects --cov=shared --cov-report=term-missing -q
      - run: uv run python -m shared.blocklist --all
      - name: release check (offline; exits 1 on any failing check)
        if: runner.os == 'Linux'
        run: uv run python -m scripts.release_check --offline
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
