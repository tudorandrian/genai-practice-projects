[project]
name = "genai-practice-projects"
version = "1.0.0"
description = "Twelve practice projects in data, machine learning and generative AI — reproducible, tested, English."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Tudor Andrian" }]
dependencies = []

[project.scripts]
demo = "shared.demo:main"
p01-mini-etl = "projects.p01_mini_etl.mini_etl:main"
p02-question-bank = "projects.p02_question_bank.qbank:main"
p03-regression = "projects.p03_regression.regression:main"
p04-decision-tree = "projects.p04_decision_tree.decision_tree:main"
p05-segmentation = "projects.p05_segmentation.segmentation:main"
p06-ml-pipeline = "projects.p06_ml_pipeline.ml_pipeline:main"
p07-sentiment-api = "projects.p07_sentiment_api.server:main"
p08-image-captioning = "projects.p08_image_captioning.captioner:main"
p09-chatbot = "projects.p09_chatbot.engine:main"
p10-meeting-assistant = "projects.p10_meeting_assistant.assistant:main"
p11-rag-chatbot = "projects.p11_rag_chatbot.rag_chatbot:main"
p12-study-hub = "projects.p12_study_hub.app:main"

[dependency-groups]
core = [
  "pandas>=3.0,<4",
  "numpy>=2.4,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.17,<2",
  "matplotlib>=3.10,<4",
  "openpyxl>=3.1,<4",
  "joblib>=1.5",
  "flask>=3.1,<4",
  "flask-cors>=6",
  "jsonschema>=4.23",
  "requests>=2.32",
]
models = [
  { include-group = "core" },
  "torch>=2.12,<3",
  "transformers>=5.13,<6",
  "gradio>=6.19,<7",
  "pillow>=12",
  "pyttsx3>=2.99",
]
rag = [
  { include-group = "models" },
  "langchain>=0.3.30,<0.4",
  "langchain-community>=0.3.31,<0.4",
  "langchain-core>=0.3,<0.4",
  "langchain-text-splitters>=0.3,<0.4",
  "langchain-huggingface>=0.3,<0.4",
  "langchain-chroma>=0.2,<0.3",
  "langchain-ollama>=0.3,<0.4",
  "langchain-openai>=0.3,<0.4",
  "chromadb>=1.5,<2",
  "sentence-transformers>=5.6,<6",
  "pypdf>=6",
  "fpdf2>=2.8",
]
dev = [
  { include-group = "core" },
  "pytest>=8.4",
  "pytest-cov>=6",
  "ruff>=0.13",
  "mypy>=1.18",
  "pre-commit>=4",
  "pandas-stubs",
  "types-requests",
  "waitress>=3",
]

[tool.uv]
default-groups = ["core", "dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["projects", "shared", "scripts"]

[tool.pytest.ini_options]
testpaths = ["projects", "shared"]
addopts = "--import-mode=importlib -ra --strict-markers"
markers = [
  "core: offline, deterministic, fast",
  "network: downloads public data",
  "models: needs Hugging Face weights",
  "rag: needs LangChain + Chroma",
  "llm: needs Ollama or an API key; not selected by any workflow",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_return_any = false
files = ["projects", "shared", "scripts"]
