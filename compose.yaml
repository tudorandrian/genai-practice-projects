services:
  # The core suite on Linux: `docker compose run --rm tests`. `run --rm` removes the
  # container when the run ends, so it never stays listed in `docker ps -a`.
  # In its own profile so `docker compose --profile llm up` does not also start it.
  tests:
    build: .
    profiles: ["tests"]
    command: ["uv", "run", "pytest", "-m", "core and not network", "-q"]

  # Optional local LLM for P10-P12 (the `llm` profile; `docker compose up` alone does not
  # start it): `docker compose --profile llm up -d`, then `uv run pytest -m llm` on the host.
  # Qwen2.5 1.5B is served by Ollama; the model files live in the `ollama` volume, or in
  # the directory named by OLLAMA_DATA when set (reuse models already on disk).
  ollama:
    image: ollama/ollama:0.34.1@sha256:0c0a83210471fb50226bcdc2d6611d20ab13ae87e024cc304c94a6a5765c5e65
    profiles: ["llm"]
    ports: ["127.0.0.1:11434:11434"] # Ollama has no authentication: never bind 0.0.0.0
    volumes: ["${OLLAMA_DATA:-ollama}:/root/.ollama"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: pulls the model into the volume (a no-op when it is already there), then exits.
  ollama-pull:
    image: ollama/ollama:0.34.1@sha256:0c0a83210471fb50226bcdc2d6611d20ab13ae87e024cc304c94a6a5765c5e65
    profiles: ["llm"]
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    depends_on: { ollama: { condition: service_healthy } }
    restart: "no"

volumes:
  ollama:
