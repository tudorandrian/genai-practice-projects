<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Chatbot (Blenderbot + Flask)</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --user: #2563eb; --bot: #334155; --text: #e2e8f0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); display: flex;
           justify-content: center; }
    main { width: min(720px, 100%); height: 100vh; display: flex; flex-direction: column; padding: 16px; }
    h1 { font-size: 1.15rem; margin: 4px 0 12px; font-weight: 600; }
    #conversation { flex: 1; overflow-y: auto; background: var(--panel);
                   border-radius: 12px; padding: 14px; display: flex;
                   flex-direction: column; gap: 10px; }
    .bubble { max-width: 80%; padding: 9px 13px; border-radius: 14px; line-height: 1.4;
              white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .bot  { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .meta { font-size: .72rem; opacity: .7; margin-bottom: 2px; }
    #status { min-height: 18px; font-size: .8rem; opacity: .8; padding: 6px 2px; }
    form { display: flex; gap: 8px; margin-top: 8px; }
    #message { flex: 1; padding: 11px 13px; border-radius: 10px; border: 1px solid #334155;
             background: var(--panel); color: var(--text); font-size: 1rem; }
    button { padding: 11px 16px; border: 0; border-radius: 10px; background: var(--user);
             color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #reset { background: #475569; }
  </style>
</head>
<body>
  <main>
    <h1>Local Chatbot — Blenderbot 400M + Flask</h1>
    <div id="conversation" aria-live="polite"></div>
    <div id="status"></div>
    <form id="form">
      <input id="message" placeholder="Type a message..." autocomplete="off" autofocus />
      <button id="send" type="submit">Send</button>
      <button id="reset" type="button">Reset</button>
    </form>
  </main>

  <script>
    const conversation = document.getElementById("conversation");
    const inputEl = document.getElementById("message");
    const sendBtn = document.getElementById("send");
    const resetBtn = document.getElementById("reset");
    const statusEl = document.getElementById("status");
    const form = document.getElementById("form");

    // Insert messages as TEXT (textContent), never innerHTML, so a message that
    // contains HTML is not executed in the page.
    function addMessage(who, text, cls) {
      const wrap = document.createElement("div");
      wrap.className = "bubble " + cls;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = who;
      const body = document.createElement("div");
      body.textContent = text;
      wrap.appendChild(meta);
      wrap.appendChild(body);
      conversation.appendChild(wrap);
      conversation.scrollTop = conversation.scrollHeight;
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      inputEl.disabled = busy;
      statusEl.textContent = busy ? "bot is typing…" : "";
    }

    async function send() {
      const message = inputEl.value.trim();
      if (!message) return;
      addMessage("You", message, "user");
      inputEl.value = "";
      setBusy(true);
      try {
        const r = await fetch("/chatbot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await r.json();
        if (r.ok) {
          addMessage("Bot", data.reply, "bot");
        } else {
          addMessage("Error", data.error || "Request failed.", "bot");
        }
      } catch (err) {
        addMessage("Error", "Could not reach the server.", "bot");
      } finally {
        setBusy(false);
        inputEl.focus();
      }
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
    resetBtn.addEventListener("click", async () => {
      await fetch("/reset", { method: "POST" });
      conversation.replaceChildren();
      statusEl.textContent = "Conversation reset.";
      inputEl.focus();
    });
  </script>
</body>
</html>
